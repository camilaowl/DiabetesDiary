buildscript {
    ext {
        kotlinVersion = '2.1.0'
        composeVersion = '1.10.6'
        kotlinCompilerExtensionVersion = '1.5.15'
        apolloVersion = "4.4.3"
        hiltVersion = '2.53'
        composeNavigationVersion = '2.9.7'
        lifecycleVersion = '2.10.0'
        roomVersion = '2.8.4'
        accompanistVersion = "0.36.0"
        pagingVersion = "3.4.2"
        serializationVersion = "1.8.0"

        gradleDependencies = [
                compileSdk: 36,
                targetSdk : 36,
                minSdk    : 28
        ]
        androidxDependencies = [
                coreKtx          : "androidx.core:core-ktx:1.16.0",
                lifecycleRuntime : "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycleVersion",
                viewModel        : "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycleVersion",
                dataStore        : "androidx.datastore:datastore:1.2.1",
                splashScreen     : "androidx.core:core-splashscreen:1.2.0",
                paging           : "androidx.paging:paging-runtime:$pagingVersion",
                appcompat        : "androidx.appcompat:appcompat:1.7.1",
                appcompatResources : "androidx.appcompat:appcompat-resources:1.7.1"
        ]
        composeDependencies = [
                ui               : "androidx.compose.ui:ui:$composeVersion",
                uiTooling        : "androidx.compose.ui:ui-tooling:$composeVersion",
                uiToolingPreview : "androidx.compose.ui:ui-tooling-preview:$composeVersion",
                material         : "androidx.compose.material:material:$composeVersion",
                runtime          : "androidx.compose.runtime:runtime:$composeVersion",
                foundation       : "androidx.compose.foundation:foundation:$composeVersion",
                foundationLayout : "androidx.compose.foundation:foundation-layout:$composeVersion",
                activity         : "androidx.activity:activity-compose:1.13.0",
                viewModel        : "androidx.lifecycle:lifecycle-viewmodel-compose:$lifecycleVersion",
                navigation       : "androidx.navigation:navigation-compose:$composeNavigationVersion",
                constraintLayout : "androidx.constraintlayout:constraintlayout-compose:1.1.1",
                lifecycleRuntime : "androidx.lifecycle:lifecycle-runtime-compose:2.10.0",
                material3        : "androidx.compose.material3:material3:1.4.0",
                paging           : "androidx.paging:paging-compose:$pagingVersion",
                icons            : "androidx.compose.material:material-icons-extended:1.7.8"
        ]
        hiltDependencies = [
                hilt             : "com.google.dagger:hilt-android:$hiltVersion",
                compiler             : "com.google.dagger:hilt-compiler:$hiltVersion",
                navigationCompose: "androidx.hilt:hilt-navigation-compose:1.3.0"
        ]
        network = [
                apolloRuntime    : "com.apollographql.apollo:apollo-runtime:$apolloVersion",
                apolloApi        : "com.apollographql.apollo:apollo-api:$apolloVersion"
        ]
        firebaseDependencies = [
                bom              : "com.google.firebase:firebase-bom:34.12.0",
                analytics        : "com.google.firebase:firebase-analytics:23.2.0",
                crashlytics      : "com.google.firebase:firebase-crashlytics:20.0.5",
                auth             : "com.google.firebase:firebase-auth:24.0.1"
        ]
        accompanist = [
                systemUiController: "com.google.accompanist:accompanist-systemuicontroller:$accompanistVersion",
                navigationMaterial: "com.google.accompanist:accompanist-navigation-material:$accompanistVersion"
        ]
        protobufDependencies = [
                protobuf: "com.google.protobuf:protobuf-kotlin-lite:4.32.1"
        ]
        playServicesDependencies = [
                auth: "com.google.android.gms:play-services-auth:21.5.1"
        ]
        roomDependencies = [
                runtime : "androidx.room:room-runtime:$roomVersion",
                compiler: "androidx.room:room-compiler:$roomVersion",
                ktx     : "androidx.room:room-ktx:$roomVersion",
                common  : "androidx.room:room-common:$roomVersion",
                paging  : "androidx.room:room-paging:$roomVersion"
        ]
        testDependencies = [
               junit : "androidx.test.ext:junit:1.3.0",
               espresso : "androidx.test.espresso:espresso-core:3.7.0"
        ]
        serialization = [
               serialization : "org.jetbrains.kotlinx:kotlinx-serialization-json:$serializationVersion"
        ]
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
        classpath 'com.google.gms:google-services:4.4.4'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.7'
    }
}

plugins {
    id 'com.android.application' version '8.9.1' apply false
    id 'com.android.library' version '8.9.1' apply false
    id 'org.jetbrains.kotlin.android' version '2.1.0' apply false
    id 'com.google.dagger.hilt.android' version '2.53' apply false
    id 'org.jetbrains.kotlin.jvm' version '2.1.0' apply false
    id 'com.google.protobuf' version "0.9.4" apply false
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.1.0' apply false
}